name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze & unit/widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rule sets
        shell: pwsh
        run: ./scripts/fetch_core.ps1 -Only rules
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags golden,core

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Android NDK
        run: |
          NDK=$(python3 -c "import json;print(json.load(open('scripts/core_versions.json', encoding='utf-8-sig'))['ndk'])")
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-${{ hashFiles('scripts/core_versions.json', 'scripts/build_libbox.sh') }}
      - name: Build libbox (sing-box)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash scripts/build_libbox.sh
      - name: Rule sets
        shell: pwsh
        run: ./scripts/fetch_core.ps1 -Only rules
      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-vpn-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Core and rule sets
        shell: pwsh
        run: ./scripts/fetch_core.ps1
      - run: flutter pub get
      - name: Generated configs pass `sing-box check`
        run: flutter test --tags core
      - name: Goldens (Windows font rendering)
        # Rendering can drift slightly between runner images; failures are
        # reported but don't block the build. Diffs are uploaded below.
        continue-on-error: true
        run: flutter test --tags golden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-failures
          path: test/golden/failures
          if-no-files-found: ignore
      - run: flutter build windows --release
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/AuroraVPN-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-vpn-windows
          path: dist/*
          if-no-files-found: error
