name: aurora_vpn
description: "Cross-platform VPN client for subscriptions and configs (sing-box core)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # UI
  intl: ^0.20.3

  # Storage
  lucide_icons_flutter: ^3.1.25
  shared_preferences: ^2.5.6

  # Desktop
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
