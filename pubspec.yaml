name: aurora_vpn
description: "Cross-platform VPN client for subscriptions and configs (sing-box core)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  app_links: ^7.2.2
  clock: ^1.1.3
  country_flags: ^4.1.2
  cryptography: ^2.9.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2

  # UI
  http: ^1.6.0
  intl: ^0.20.3

  lucide_icons_flutter: ^3.1.25

  # Storage
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # Desktop
  tray_manager: 0.5.3
  window_manager: ^0.5.2
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Rule sets fetched by scripts/fetch_core.* (not committed).
    - assets/rules/
    - assets/tray/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
